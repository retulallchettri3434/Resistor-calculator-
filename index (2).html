<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor Color Code Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 20px;
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        /* Resistor Body Display */
        .resistor-display {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }

        .wire {
            position: absolute;
            width: 90%;
            height: 6px;
            background-color: #94a3b8;
            z-index: 1;
        }

        .resistor-body {
            position: relative;
            z-index: 2;
            width: 220px;
            height: 50px;
            background-color: #d1b894;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 16px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
        }

        .band {
            width: 14px;
            height: 100%;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
        }

        /* Controls */
        .input-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        /* Result Box */
        .result-box {
            margin-top: 20px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .result-title {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 26px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 6px;
        }

        .result-tolerance {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Resistor Color Code Tool</h1>

    <!-- Visual Graphic -->
    <div class="resistor-display">
        <div class="wire"></div>
        <div class="resistor-body">
            <div id="previewBand1" class="band"></div>
            <div id="previewBand2" class="band"></div>
            <div id="previewBand3" class="band"></div>
            <div id="previewBand4" class="band"></div>
        </div>
    </div>

    <!-- Dropdowns -->
    <div class="input-group">
        <label for="band1">1st Band (First Digit)</label>
        <select id="band1" onchange="calculateResistance()">
            <option value="1" data-color="#8B4513">Brown (1)</option>
            <option value="2" data-color="#EF4444" selected>Red (2)</option>
            <option value="3" data-color="#F97316">Orange (3)</option>
            <option value="4" data-color="#EAB308">Yellow (4)</option>
            <option value="5" data-color="#22C55E">Green (5)</option>
            <option value="6" data-color="#3B82F6">Blue (6)</option>
            <option value="7" data-color="#A855F7">Violet (7)</option>
            <option value="8" data-color="#6B7280">Gray (8)</option>
            <option value="9" data-color="#FFFFFF">White (9)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="band2">2nd Band (Second Digit)</label>
        <select id="band2" onchange="calculateResistance()">
            <option value="0" data-color="#000000">Black (0)</option>
            <option value="1" data-color="#8B4513">Brown (1)</option>
            <option value="2" data-color="#EF4444" selected>Red (2)</option>
            <option value="3" data-color="#F97316">Orange (3)</option>
            <option value="4" data-color="#EAB308">Yellow (4)</option>
            <option value="5" data-color="#22C55E">Green (5)</option>
            <option value="6" data-color="#3B82F6">Blue (6)</option>
            <option value="7" data-color="#A855F7">Violet (7)</option>
            <option value="8" data-color="#6B7280">Gray (8)</option>
            <option value="9" data-color="#FFFFFF">White (9)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="band3">Multiplier</label>
        <select id="band3" onchange="calculateResistance()">
            <option value="1" data-color="#000000">Black (x1 Ω)</option>
            <option value="10" data-color="#8B4513">Brown (x10 Ω)</option>
            <option value="100" data-color="#EF4444" selected>Red (x100 Ω)</option>
            <option value="1000" data-color="#F97316">Orange (x1 kΩ)</option>
            <option value="10000" data-color="#EAB308">Yellow (x10 kΩ)</option>
            <option value="100000" data-color="#22C55E">Green (x100 kΩ)</option>
            <option value="1000000" data-color="#3B82F6">Blue (x1 MΩ)</option>
            <option value="0.1" data-color="#D4AF37">Gold (x0.1 Ω)</option>
            <option value="0.01" data-color="#C0C0C0">Silver (x0.01 Ω)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="band4">Tolerance</label>
        <select id="band4" onchange="calculateResistance()">
            <option value="1" data-color="#8B4513">Brown (±1%)</option>
            <option value="2" data-color="#EF4444">Red (±2%)</option>
            <option value="5" data-color="#D4AF37" selected>Gold (±5%)</option>
            <option value="10" data-color="#C0C0C0">Silver (±10%)</option>
        </select>
    </div>

    <!-- Output -->
    <div class="result-box">
        <div class="result-title">Calculated Value</div>
        <div class="result-value" id="resistanceOutput">2.2 kΩ</div>
        <div class="result-tolerance" id="toleranceOutput">Tolerance: ±5%</div>
    </div>
</div>

<script>
    function updateBandVisuals() {
        const b1 = document.getElementById("band1");
        const b2 = document.getElementById("band2");
        const b3 = document.getElementById("band3");
        const b4 = document.getElementById("band4");

        document.getElementById("previewBand1").style.backgroundColor = b1.options[b1.selectedIndex].getAttribute("data-color");
        document.getElementById("previewBand2").style.backgroundColor = b2.options[b2.selectedIndex].getAttribute("data-color");
        document.getElementById("previewBand3").style.backgroundColor = b3.options[b3.selectedIndex].getAttribute("data-color");
        document.getElementById("previewBand4").style.backgroundColor = b4.options[b4.selectedIndex].getAttribute("data-color");
    }

    function calculateResistance() {
        updateBandVisuals();

        const digit1 = document.getElementById("band1").value;
        const digit2 = document.getElementById("band2").value;
        const multiplier = parseFloat(document.getElementById("band3").value);
        const tolerance = document.getElementById("band4").value;

        const baseValue = parseInt(digit1 + digit2, 10);
        const totalOhms = baseValue * multiplier;

        let displayValue = "";

        if (totalOhms >= 1000000) {
            displayValue = (totalOhms / 1000000).toFixed(2).replace(/\.00$/, '') + " MΩ";
        } else if (totalOhms >= 1000) {
            displayValue = (totalOhms / 1000).toFixed(2).replace(/\.00$/, '') + " kΩ";
        } else {
            displayValue = totalOhms.toFixed(2).replace(/\.00$/, '') + " Ω";
        }

        document.getElementById("resistanceOutput").innerText = displayValue;
        document.getElementById("toleranceOutput").innerText = "Tolerance: ±" + tolerance + "%";
    }

    // Initialize display on startup
    calculateResistance();
</script>

</body>
</html>
